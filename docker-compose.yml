services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uoct}
      POSTGRES_USER: ${POSTGRES_USER:-uoct_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uoct_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uoct_user} -d ${POSTGRES_DB:-uoct}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-secret-key-before-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      POSTGRES_DB: ${POSTGRES_DB:-uoct}
      POSTGRES_USER: ${POSTGRES_USER:-uoct_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uoct_password_change_me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      UOCT_MAX_UPLOAD_MB: ${UOCT_MAX_UPLOAD_MB:-100}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "${UOCT_WEB_PORT:-8000}:8000"

volumes:
  postgres_data:
  media_data:
  static_data:
