<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | UOCT</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
  <main class="login-panel">
    <div class="brand login-brand">
      <span class="brand-dot"></span>
      <div>
        <strong>UOCT</strong>
        <small>Sistema de análisis de cruces</small>
      </div>
    </div>
    <h1>Iniciar sesión</h1>
    {% if form.errors %}
      <div class="message error">Usuario o contraseña inválidos.</div>
    {% endif %}
    <form method="post" class="form-stack">
      {% csrf_token %}
      <label>
        Usuario
        {{ form.username }}
      </label>
      <label>
        Contraseña
        {{ form.password }}
      </label>
      <button class="button primary" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
